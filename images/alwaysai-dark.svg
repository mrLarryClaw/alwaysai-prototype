<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500&amp;display=swap');
      .lbl { font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>
  <rect width="600" height="200" rx="0" fill="#0D0D0D"/>
  <!-- Signal dot -->
  <circle cx="60" cy="90" r="28" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <circle cx="60" cy="90" r="18" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.22"/>
  <circle cx="60" cy="90" r="8" fill="#ffffff"/>
  <!-- Wordmark -->
  <text x="95" y="105" class="lbl" font-size="48" font-weight="300" fill="#ffffff" letter-spacing="-1">always<tspan font-weight="500">ai</tspan></text>
  <!-- Tagline -->
  <text x="60" y="148" class="lbl" font-size="13" font-weight="300" fill="#ffffff" opacity="0.4" letter-spacing="3.5">AI-NATIVE SERVICES</text>
  <!-- Divider -->
  <line x1="60" y1="160" x2="540" y2="160" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
</svg>
